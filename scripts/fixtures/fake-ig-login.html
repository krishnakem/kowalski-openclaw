<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <title>Instagram — Login (fixture)</title>
    <style>
        body { font-family: -apple-system, "Segoe UI", sans-serif; background: #fafafa; margin: 0; padding: 40px; display: flex; justify-content: center; }
        .card { background: white; border: 1px solid #dbdbdb; border-radius: 1px; padding: 24px 40px; width: 348px; }
        h1 { font-family: "Billabong", cursive; font-size: 40px; text-align: center; margin: 24px 0; }
        input { width: 100%; padding: 9px 8px; margin: 4px 0; border: 1px solid #dbdbdb; border-radius: 3px; background: #fafafa; font-size: 12px; box-sizing: border-box; }
        button { width: 100%; padding: 8px; margin-top: 12px; background: #0095f6; color: white; border: none; border-radius: 4px; font-weight: 600; cursor: pointer; font-size: 14px; }
        button:disabled { background: #b2dffc; cursor: not-allowed; }
        .success { display: none; padding: 24px; background: #e6f7e6; border: 1px solid #4caf50; border-radius: 4px; margin-top: 24px; text-align: center; color: #2e7d32; }
        .success.visible { display: block; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Instagram</h1>
        <form id="login-form" onsubmit="return handleSubmit(event)">
            <input id="username" name="username"
                   aria-label="Phone number, username or email"
                   placeholder="Phone number, username or email"
                   autocomplete="off" />
            <input id="password" name="password" type="password"
                   aria-label="Password"
                   placeholder="Password"
                   autocomplete="off" />
            <button id="login-button" type="submit" aria-label="Log in">Log in</button>
        </form>
        <div id="success" class="success" role="status">
            ✅ Login submitted successfully
            <div id="received-values" style="margin-top:8px;font-size:12px;color:#555;"></div>
        </div>
    </div>
    <script>
        function handleSubmit(e) {
            e.preventDefault();
            const u = document.getElementById('username').value;
            const p = document.getElementById('password').value;
            // Expose submitted values on window so the Playwright test can assert them
            // without the LoginAgent ever seeing them in the LLM trace.
            window.__kowalskiSubmitted = { username: u, passwordLength: p.length };
            const el = document.getElementById('success');
            el.classList.add('visible');
            document.getElementById('received-values').textContent =
                'username=' + u + ', password chars=' + p.length;
            return false;
        }
    </script>
</body>
</html>
